{% extends "base.html" %}
{% block content %}
<div class="container mt-4 text-center">
    <h2>Delete Post</h2>
    <p>Are you sure you want to delete <strong>{{ post.title }}</strong>?</p>
    <form action="{{ url_for('posts.delete_post', id=post.id) }}" method="POST">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{{ url_for('posts.detail_post', id=post.id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ post.title }}</h2>
    <p class="text-muted">by {{ post.author }} on {{ post.posted.strftime('%Y-%m-%d %H:%M') }}</p>
    <p>{{ post.content }}</p>
    <p><strong>Category:</strong> {{ post.category.value }}</p>
    <a href="{{ url_for('posts.update_post', id=post.id) }}" class="btn btn-warning">Edit</a>
    <form action="{{ url_for('posts.delete_post', id=post.id) }}" method="POST" style="display:inline;">
        <button type="submit" class="btn btn-danger">Delete</button>
    </form>
    <a href="{{ url_for('posts.all_posts') }}" class="btn btn-secondary">Back</a>
</div>
{% endblock %}

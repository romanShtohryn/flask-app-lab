{% extends 'base.html' %}
{% block title %}Products{% endblock %}
{% block content %}
  <h1>Products</h1>
  <ul class="list-group">
    {% for p in products %}
      <li class="list-group-item d-flex justify-content-between align-items-center">
        {{ p.name }}
        <span class="badge bg-primary">{{ p.price }}</span>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
